apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: __JOB_NAME__
spec:
  # Concurrency knobs for the Job itself
  taskCount: __TASK_COUNT__          # integer
  parallelism: __PARALLELISM__       # integer, <= taskCount
  maxRetries: 1                      # retry budget per task (v1 field name)
  
  template: # This template defines the structure of each individual task
    spec: # TaskTemplateSpec (the "pod" shape for each task)
      serviceAccountName: __JOB_SA__
      containers:
      - name: runner
        image: __REGION__-docker.pkg.dev/__PROJECT_ID__/__REPO__/__IMAGE__:__COMMIT_SHA__
        command: ["python3", "tools/run_all.py"]
        env:
        - name: RESULTS_BUCKET
          value: __RESULTS_BUCKET__
        - name: COMMIT_SHA
          value: __COMMIT_SHA__
        - name: CLOUD_RUN_TASK_COUNT
          value: "__TASK_COUNT__"
        resources:
          limits:
            cpu: "8000m"
            memory: "32Gi"
      restartPolicy: Never
      timeoutSeconds: 86400
