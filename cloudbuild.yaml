# cloudbuild.yaml
substitutions:
  _REGION: us-central1
  _REPO: elmfire-raw                # Artifact Registry repository name (already created)
  _IMAGE: elmfire                     # Image name

logsBucket: gs://elmfire-raw-tests

options:
  machineType: 'E2_HIGHCPU_8'
timeout: '3600s'

steps:
# 1) Quick tests – wire up your actual test runner here
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args: ['-lc', 'echo "[INFO] TODO: run pytest -q / unit tests here" && exit 0']

# 2) Build & push (amd64)
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: 'bash'
  args:
    - -lc
    - |
      set -euo pipefail
      docker buildx inspect default >/dev/null 2>&1 || docker buildx create --name default --use
      docker buildx build \
        --platform linux/amd64 \
        -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_IMAGE}:v0.2.0 \
        --push .
